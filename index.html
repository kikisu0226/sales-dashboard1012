<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>銷售數據分析儀表板 (動態切換版)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 20px; background-color: #f4f7f6; }
        h1 { text-align: center; color: #2c3e50; margin-bottom: 15px; }
        
        /* 切換按鈕區塊 */
        .control-panel { display: flex; justify-content: center; align-items: center; gap: 15px; margin-bottom: 25px; background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .control-panel label { font-weight: bold; color: #34495e; font-size: 16px; }
        .btn-toggle { padding: 10px 20px; font-size: 15px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; transition: 0.3s; background-color: #e0e0e0; color: #333; }
        .btn-toggle.active { background-color: #3498db; color: white; box-shadow: 0 2px 5px rgba(52,152,219,0.4); }
        
        .metrics-container { display: flex; gap: 15px; justify-content: space-between; margin-bottom: 25px; flex-wrap: wrap; }
        .metric-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); flex: 1; min-width: 180px; text-align: center; }
        .metric-card h3 { margin: 0; color: #7f8c8d; font-size: 14px; text-transform: uppercase; }
        .metric-card p { margin: 10px 0 0 0; font-size: 24px; font-weight: bold; color: #2c3e50; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(450px, 1fr)); gap: 20px; }
        .chart-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .chart-card h3 { margin-top: 0; color: #34495e; font-size: 16px; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
    </style>
</head>

    <h1>銷售數據分析儀表板</h1>

    <!-- 資料集動態切換列 -->
    <div class="control-panel">

        <button id="btn-orig" class="btn-toggle active" onclick="switchData('original')">sales_original_300</button>
        <button id="btn-upd" class="btn-toggle" onclick="switchData('updated')">sales_updated_300</button>
    </div>
    
    <!-- 核心數據卡片 -->
    <div class="metrics-container">
        <div class="metric-card"><h3>總筆數</h3><p id="val-records">-</p></div>
        <div class="metric-card"><h3>總售出數量</h3><p id="val-quantity">-</p></div>
        <div class="metric-card"><h3>總退貨數量</h3><p id="val-returns">-</p></div>
        <div class="metric-card"><h3>總淨銷售額 (NTD)</h3><p id="val-net-rev">-</p></div>
    </div>

    <!-- 5大分析圖表 -->
    <div class="grid-container">
        <div class="chart-card"><h3>1. 每日淨銷售額折線圖</h3><canvas id="dailyChart"></canvas></div>

        <div class="chart-card"><h3>3. 各商品淨銷售額 (長條圖)</h3><canvas id="productChart"></canvas></div>
        <div class="chart-card"><h3>4. 通路銷售額比較</h3><canvas id="channelChart"></canvas></div>
